    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How long is a sleep cycle?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A full cycle of light sleep, deep sleep and REM sleep lasts about 90 minutes on average. It varies between people and across the night, with more deep sleep early on and more REM later."
            }
          },
          {
            "@type": "Question",
            "name": "Why does waking at the end of a cycle matter?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You wake most easily from light sleep, which comes at the end of a cycle. Waking from deep sleep causes sleep inertia: a groggy, disoriented feeling that can last up to half an hour."
            }
          },
          {
            "@type": "Question",
            "name": "How many hours of sleep do I need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Most adults do best on five to six cycles a night, roughly 7.5 to 9 hours in bed after allowing time to fall asleep. Four cycles is a workable short night; three is a last resort."
            }
          },
          {
            "@type": "Question",
            "name": "Is this sleep calculator accurate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It is a rule of thumb based on the average 90-minute cycle. It cannot measure your actual sleep stages and does not replace a doctor's advice if you regularly sleep poorly. A consistent schedule matters more than an exact wake-up minute."
            }
          }
        ]
      }
    </script>
